name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev libffi-dev libltdl-dev cmake ccache

      - name: Install buildozer
        run: pip install --upgrade buildozer cython virtualenv

      - name: Cache Android SDK/NDK
        uses: actions/cache@v4
        with:
          # 只缓存 SDK/NDK（大且稳定）。不缓存 build/ 与 p4a 克隆：否则残留的半成品
          # hostpython/venv 会污染下次构建，pip 24/25 文件混版导致 open_rich_spinner ImportError
          path: |
            ~/.buildozer/android/platform/android-sdk
            ~/.buildozer/android/platform/android-ndk-r28c
          key: android-sdk-ndk-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: android-sdk-ndk-${{ runner.os }}-

      - name: Build APK
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jam-intranexus-apk
          path: bin/*.apk
          if-no-files-found: error
